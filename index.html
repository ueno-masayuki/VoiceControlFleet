<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceControlFleet - 音声制御艦隊ゲーム</title>
  <meta name="description" content="音声で指揮する、Webベースのリアルタイム艦隊戦略ゲーム">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0a1929;
      color: #ffffff;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #loading h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #4fc3f7;
    }

    #loading p {
      font-size: 1.2rem;
      color: #90caf9;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <h1>⚓ VoiceControlFleet</h1>
      <p>読み込み中...</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
